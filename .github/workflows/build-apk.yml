name: Build Flippin Atlas

on: [workflow_dispatch, push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Descomprimir proyecto
        run: |
          unzip -o AlbionFlipAssistant.zip -d proj
          echo "=== Contenido del zip ==="
          ls -la proj
          ROOT=$(find proj -name "settings.gradle*" -printf "%h\n" | head -1)
          if [ -z "$ROOT" ]; then
            echo "ERROR: settings.gradle no encontrado en el zip"
            exit 1
          fi
          echo "Raiz del proyecto: $ROOT"
          cp -a "$ROOT"/. .
          echo "=== Archivos en la raiz ==="
          ls -la

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FlippinAtlas.apk
          ls -la FlippinAtlas.apk

      - name: Guardar artefacto Flippin-Atlas
        uses: actions/upload-artifact@v4
        with:
          name: Flippin-Atlas
          path: FlippinAtlas.apk

      - name: Publicar en Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "Flippin-Atlas-v${{ github.run_number }}" FlippinAtlas.apk --title "Flippin Atlas" --notes "APK listo para instalar en Android"
