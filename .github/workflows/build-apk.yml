name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar el proyecto (ZIP o carpetas)
        run: |
          if [ -f AlbionFlipAssistant.zip ]; then
            unzip -q AlbionFlipAssistant.zip -d extracted
            echo "PROJECT_DIR=extracted/AlbionFlipAssistant" >> "$GITHUB_ENV"
          elif [ -f gradlew ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "::error::No se encontró AlbionFlipAssistant.zip en la raíz del repositorio. Súbelo con Add file → Upload files (debe llamarse exactamente AlbionFlipAssistant.zip)."
            exit 1
          fi

      - name: Compilar APK (debug)
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Publicar el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: AlbionFlipAssistant-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
